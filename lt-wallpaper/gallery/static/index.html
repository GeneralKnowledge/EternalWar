<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LT Wallpaper Gallery</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080a0e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c8f06c'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <h1>LT Wallpaper</h1>
      <p>Native Josh Parnell bake · gallery + generate</p>
    </div>
    <p class="rate" id="rate">Checking rate limit…</p>
  </header>

  <main>
    <section class="compose" aria-label="Generate">
      <div class="cats" id="cats" role="listbox" aria-label="Category"></div>

      <form class="controls" id="form">
        <label class="field">
          <span>Seed</span>
          <div class="row">
            <input id="seed" type="text" placeholder="random if empty" spellcheck="false" autocomplete="off" />
            <button type="button" id="rand" title="Random seed">↻</button>
          </div>
        </label>
        <label class="field">
          <span>Size</span>
          <select id="size"></select>
        </label>
        <label class="field">
          <span>Quality</span>
          <select id="quality"></select>
        </label>
        <label class="field">
          <span>Count</span>
          <input id="count" type="number" min="1" max="8" value="1" title="Keep every plate from one launch" />
        </label>
        <label class="field">
          <span>Best of</span>
          <input id="best" type="number" min="1" max="8" value="4" title="Bake N candidates, keep the highest-scoring plate" />
        </label>
        <button type="submit" class="primary" id="generate">Generate</button>
      </form>
      <p class="status" id="status">Ready — native bake. Best-of keeps one winner; Count keeps every plate.</p>
    </section>

    <section class="gallery-wrap" aria-label="Gallery">
      <div class="gallery-bar">
        <h2>Gallery</h2>
        <div class="filters" id="filters"></div>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>
  </main>

  <dialog id="lightbox" class="lightbox">
    <form method="dialog">
      <button value="close" class="close" aria-label="Close">×</button>
    </form>
    <img id="lightImg" alt="" />
    <p id="lightMeta"></p>
    <a id="lightDl" download>Download PNG</a>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
