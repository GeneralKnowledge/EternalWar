# Example reverse proxy — terminate TLS elsewhere or add certbot.
# Point server_name at your host and reload nginx.

upstream lt_wallpaper_gallery {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name wallpapers.example.com;

    client_max_body_size 1m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Bakes can take minutes on software GL
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://lt_wallpaper_gallery;
    }
}
